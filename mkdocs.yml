site_name: Oddo Botica - ERP Odoo 18
site_url: http://localhost:8000/
repo_url: https://github.com/rbn-69-cod/oddo-botica
repo_name: rbn-69-cod/oddo-botica
docs_dir: docs

nav:
  - Inicio: index.md
  - Migración a Odoo: odoo.md

theme:
  name: material
  language: es
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
plugins:
  - search:
      lang: es
