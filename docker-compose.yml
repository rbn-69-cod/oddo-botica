services:
  db:
    image: postgres:16-alpine
    container_name: oddo-botica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME:-postgres}
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?ODOO_DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - oddo-net

  odoo:
    image: odoo:18.0
    container_name: oddo-botica
    restart: unless-stopped
    depends_on:
      - db
    environment:
      HOST: db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:?ODOO_DB_PASSWORD is required}
    command:
      - odoo
      - --db_host=db
      - --db_port=5432
      - --db_user=${ODOO_DB_USER:-odoo}
      - --db_password=${ODOO_DB_PASSWORD:?ODOO_DB_PASSWORD is required}
      - --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      - --proxy-mode
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    networks:
      - oddo-net

  frontend:
    build:
      context: ./clients/medizano-frontend
    container_name: oddo-botica-frontend
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    networks:
      - oddo-net

volumes:
  odoo-db-data:
  odoo-data:

networks:
  oddo-net:
    name: oddo-botica-net
